name: Serializer writer hotspot isolation

on:
  push:
    branches:
      - "benchmark/diagnostic-scaling-jfr"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build serializer and diagnostic harness
        run: |
          mvn --batch-mode --no-transfer-progress clean install
          mvn --batch-mode --no-transfer-progress -f benchmarks/pom.xml clean package
      - name: Capture default and no-inline writer profiles on the same runner
        working-directory: benchmarks
        run: |
          set -euo pipefail
          mkdir -p results

          echo "Default JIT inlining profile"
          java -Xms512m -Xmx2g \
            "-XX:StartFlightRecording=filename=results/jfr-own-encode-default.jfr,settings=profile,dumponexit=true" \
            -cp target/benchmarks.jar json.bench.HeavyLoadBenchmark own encode 4 4 15 \
            | tee results/jfr-own-encode-default.json
          jfr summary results/jfr-own-encode-default.jfr > results/jfr-own-encode-default-summary.txt

          echo "No-inline diagnostic profile"
          java -Xms512m -Xmx2g \
            -XX:CompileCommand=dontinline,json/JsonWriter.value \
            -XX:CompileCommand=dontinline,json/JsonWriter.rawString \
            "-XX:StartFlightRecording=filename=results/jfr-own-encode-noinline.jfr,settings=profile,dumponexit=true" \
            -cp target/benchmarks.jar json.bench.HeavyLoadBenchmark own encode 4 4 15 \
            | tee results/jfr-own-encode-noinline.json
          jfr summary results/jfr-own-encode-noinline.jfr > results/jfr-own-encode-noinline-summary.txt

          echo "Unprofiled default JIT baseline"
          java -Xms512m -Xmx2g -cp target/benchmarks.jar \
            json.bench.HeavyLoadBenchmark own encode 4 4 15 \
            | tee results/stress-default.json

          echo "Unprofiled value() no-inline"
          java -Xms512m -Xmx2g \
            -XX:CompileCommand=dontinline,json/JsonWriter.value \
            -cp target/benchmarks.jar json.bench.HeavyLoadBenchmark own encode 4 4 15 \
            | tee results/stress-value-noinline.json

          echo "Unprofiled value() and rawString() no-inline"
          java -Xms512m -Xmx2g \
            -XX:CompileCommand=dontinline,json/JsonWriter.value \
            -XX:CompileCommand=dontinline,json/JsonWriter.rawString \
            -cp target/benchmarks.jar json.bench.HeavyLoadBenchmark own encode 4 4 15 \
            | tee results/stress-value-rawstring-noinline.json

          echo "Jackson reference on the same runner"
          java -Xms512m -Xmx2g -cp target/benchmarks.jar \
            json.bench.HeavyLoadBenchmark jackson encode 4 4 15 \
            | tee results/stress-jackson.json
      - name: Upload writer profiles
        uses: actions/upload-artifact@v4
        with:
          name: json-serializer-writer-hotspot-profile
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 90
