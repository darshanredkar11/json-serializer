name: Escaped key dispatch baseline vs candidate

on:
  push:
    branches:
      - "benchmark/escaped-key-ab"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  escaped-key-ab:
    name: Escaped-key dispatch A/B (Temurin 21)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: a9840cb5a98f0482fbd41149837318ebae02cf20
          path: baseline

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: d9dc3bc0ccfe14016443d1c9e442eb78860b86f9
          path: candidate

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Capture environment
        run: |
          mkdir -p results
          {
            echo "UTC: $(date -u +%FT%TZ)"
            echo "Baseline: a9840cb5a98f0482fbd41149837318ebae02cf20"
            echo "Candidate: d9dc3bc0ccfe14016443d1c9e442eb78860b86f9"
            java -version 2>&1
            uname -a
            lscpu
            free -h
          } > results/environment.txt

      - name: Build baseline serializer and benchmark harness
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -f baseline/pom.xml clean install
          mvn --batch-mode --no-transfer-progress -f candidate/benchmarks/pom.xml clean package

      - name: Run baseline escaped-key benchmark
        shell: bash
        run: |
          set -euo pipefail
          for threads in 1 4; do
            java -Xms2g -Xmx2g -jar candidate/benchmarks/target/benchmarks.jar \
              'json.bench.EscapedKeyDispatchBenchmark' \
              -t "$threads" -f 3 -wi 3 -i 5 -w 1s -r 1s -prof gc \
              -rf json -rff "results/baseline-${threads}t.json"
          done

      - name: Build candidate serializer and benchmark harness
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -f candidate/pom.xml clean install
          mvn --batch-mode --no-transfer-progress -f candidate/benchmarks/pom.xml clean package

      - name: Run candidate escaped-key benchmark
        shell: bash
        run: |
          set -euo pipefail
          for threads in 1 4; do
            java -Xms2g -Xmx2g -jar candidate/benchmarks/target/benchmarks.jar \
              'json.bench.EscapedKeyDispatchBenchmark' \
              -t "$threads" -f 3 -wi 3 -i 5 -w 1s -r 1s -prof gc \
              -rf json -rff "results/candidate-${threads}t.json"
          done

      - name: Upload matched results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escaped-key-dispatch-ab-java21
          path: results/
          if-no-files-found: error
          retention-days: 90
