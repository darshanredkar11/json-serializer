name: Serializer encoder source-level A/B

on:
  push:
    branches:
      - "benchmark/diagnostic-scaling-jfr"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serializer-encoder-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encoder-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and benchmark pre-refactor baseline
        env:
          BASE_SHA: 0b7a70f1b89eaed2f906576a651a3338493496f4
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/benchmarks/results"
          git worktree add ../encoder-baseline "$BASE_SHA"
          cd ../encoder-baseline
          mvn --batch-mode --no-transfer-progress clean install
          mvn --batch-mode --no-transfer-progress -f benchmarks/pom.xml clean package
          for threads in 1 4; do
            java -Xms2g -Xmx2g -jar benchmarks/target/benchmarks.jar \
              'json.bench.CollectionScalingBenchmark.(ownEncodeBytes|jacksonEncodeBytes)' \
              -t "$threads" -p tagCount=256 -bm thrpt -f 3 -wi 3 -i 5 \
              -w 1s -r 1s -prof gc -rf json \
              -rff "benchmarks/results/encoder-baseline-${threads}t.json"
          done
          cp benchmarks/results/encoder-baseline-*.json "$GITHUB_WORKSPACE/benchmarks/results/"
      - name: Build and benchmark outlined-loop candidate
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress clean install
          mvn --batch-mode --no-transfer-progress -f benchmarks/pom.xml clean package
          for threads in 1 4; do
            java -Xms2g -Xmx2g -jar benchmarks/target/benchmarks.jar \
              'json.bench.CollectionScalingBenchmark.(ownEncodeBytes|jacksonEncodeBytes)' \
              -t "$threads" -p tagCount=256 -bm thrpt -f 3 -wi 3 -i 5 \
              -w 1s -r 1s -prof gc -rf json \
              -rff "benchmarks/results/encoder-candidate-${threads}t.json"
          done
      - name: Upload matched encoder comparison
        uses: actions/upload-artifact@v4
        with:
          name: serializer-encoder-source-ab
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 30
