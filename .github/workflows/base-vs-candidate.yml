name: Base vs compile-time dispatch benchmarks

on:
  push:
    branches:
      - "benchmark/base-vs-compile-time-dispatch"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ab-benchmark:
    name: Matched baseline vs candidate (Temurin 21)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: 8fc5c80ce2cd4660362c74925df3cf86a335350b
          path: baseline

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: 850d1469a090340be4ac88f23fc6b5fda511f337
          path: candidate

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Capture environment
        run: |
          mkdir -p results
          {
            echo "UTC: $(date -u +%FT%TZ)"
            echo "Baseline: 8fc5c80ce2cd4660362c74925df3cf86a335350b"
            echo "Candidate: 850d1469a090340be4ac88f23fc6b5fda511f337"
            java -version 2>&1
            uname -a
            lscpu
            free -h
          } > results/environment.txt

      - name: Build and test baseline serializer
        run: mvn --batch-mode --no-transfer-progress -f baseline/pom.xml clean install

      - name: Build benchmark harness against baseline
        run: mvn --batch-mode --no-transfer-progress -f candidate/benchmarks/pom.xml clean package

      - name: Run baseline JMH with GC profiler
        working-directory: candidate/benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../results
          for threads in 1 2 4 8; do
            java -Xms2g -Xmx2g -jar target/benchmarks.jar 'json.bench.GeneratedRecordBenchmark' \
              -t "$threads" -f 3 -wi 3 -i 3 -w 1s -r 1s -prof gc \
              -rf json -rff "../../results/baseline-generated-${threads}t.json"
            java -Xms2g -Xmx2g -jar target/benchmarks.jar 'json.bench.CollectionScalingBenchmark' \
              -t "$threads" -f 3 -wi 3 -i 3 -w 1s -r 1s -prof gc \
              -rf json -rff "../../results/baseline-collection-${threads}t.json"
          done

      - name: Run baseline concurrent stress
        working-directory: candidate/benchmarks
        shell: bash
        run: |
          set -euo pipefail
          for library in own jackson gson; do
            for operation in encode decode; do
              for threads in 1 2 4 8 16; do
                echo "BASELINE $library $operation $threads"
                java -Xms256m -Xmx2g -cp target/benchmarks.jar \
                  json.bench.HeavyLoadBenchmark "$library" "$operation" "$threads" 8 20 \
                  | tee -a ../../results/baseline-heavy-load.jsonl
              done
            done
          done

      - name: Build and test candidate serializer
        run: mvn --batch-mode --no-transfer-progress -f candidate/pom.xml clean install

      - name: Rebuild benchmark harness against candidate
        run: mvn --batch-mode --no-transfer-progress -f candidate/benchmarks/pom.xml clean package

      - name: Run candidate JMH with GC profiler
        working-directory: candidate/benchmarks
        shell: bash
        run: |
          set -euo pipefail
          for threads in 1 2 4 8; do
            java -Xms2g -Xmx2g -jar target/benchmarks.jar 'json.bench.GeneratedRecordBenchmark' \
              -t "$threads" -f 3 -wi 3 -i 3 -w 1s -r 1s -prof gc \
              -rf json -rff "../../results/candidate-generated-${threads}t.json"
            java -Xms2g -Xmx2g -jar target/benchmarks.jar 'json.bench.CollectionScalingBenchmark' \
              -t "$threads" -f 3 -wi 3 -i 3 -w 1s -r 1s -prof gc \
              -rf json -rff "../../results/candidate-collection-${threads}t.json"
          done

      - name: Run candidate concurrent stress
        working-directory: candidate/benchmarks
        shell: bash
        run: |
          set -euo pipefail
          for library in own jackson gson; do
            for operation in encode decode; do
              for threads in 1 2 4 8 16; do
                echo "CANDIDATE $library $operation $threads"
                java -Xms256m -Xmx2g -cp target/benchmarks.jar \
                  json.bench.HeavyLoadBenchmark "$library" "$operation" "$threads" 8 20 \
                  | tee -a ../../results/candidate-heavy-load.jsonl
              done
            done
          done

      - name: Upload matched benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-vs-compile-time-dispatch-java21
          path: results/
          if-no-files-found: error
          retention-days: 90
