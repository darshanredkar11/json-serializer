name: Serializer bottleneck diagnostics

on:
  push:
    branches:
      - "benchmark/diagnostic-scaling-jfr"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serializer-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Payload scaling and JFR profiles (Temurin 21)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test serializer
        run: mvn --batch-mode --no-transfer-progress clean install

      - name: Build diagnostic harness
        working-directory: benchmarks
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Capture diagnostic environment
        run: |
          mkdir -p benchmarks/results
          {
            date -u
            java -version 2>&1
            uname -a
            lscpu
            free -h
            grep -E '<(jackson.version|gson.version|jmh.version)>' benchmarks/pom.xml
          } > benchmarks/results/diagnostic-environment.txt

      - name: Collection-size sweep with JMH and allocation profiler
        working-directory: benchmarks
        shell: bash
        run: |
          set -euo pipefail
          for threads in 1 4; do
            java -Xms2g -Xmx2g -jar target/benchmarks.jar \
              'json.bench.CollectionScalingBenchmark.*' \
              -t "$threads" -p tagCount=0,3,16,64,256,1024 \
              -f 3 -wi 3 -i 4 -w 1s -r 1s -prof gc \
              -rf json -rff "results/scaling-${threads}t.json"
          done

      - name: JFR profiles for each implementation and operation
        working-directory: benchmarks
        shell: bash
        run: |
          set -euo pipefail
          for library in own jackson gson; do
            for operation in encode decode; do
              recording="results/jfr-${library}-${operation}.jfr"
              echo "Recording $library $operation"
              java -Xms512m -Xmx2g \
                "-XX:StartFlightRecording=filename=$recording,settings=profile,dumponexit=true" \
                -cp target/benchmarks.jar json.bench.HeavyLoadBenchmark \
                "$library" "$operation" 4 4 12 \
                | tee "results/jfr-${library}-${operation}.json"
              jfr summary "$recording" > "results/jfr-${library}-${operation}-summary.txt"
            done
          done

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: json-serializer-bottleneck-diagnostics
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 90
